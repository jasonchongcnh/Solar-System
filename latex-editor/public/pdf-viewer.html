<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document preview</title>
  <link rel="stylesheet" href="/pdf-viewer.css">
  <script type="module" src="/pdf-viewer.js"></script>
</head>
<body>
  <nav class="pdf-controls" aria-label="PDF navigation">
    <button id="previous-page" aria-label="Previous page" title="Previous page" disabled>‹</button>
    <label class="page-label" for="page-number">Page</label>
    <input id="page-number" type="number" min="1" value="1" aria-label="Page number" disabled>
    <span id="page-count">/ —</span>
    <button id="next-page" aria-label="Next page" title="Next page" disabled>›</button>
    <select id="zoom" aria-label="PDF zoom"><option value="fit">Fit width</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
    <a id="open-pdf" target="_blank" rel="noopener" title="Open PDF" aria-label="Open PDF">↗</a>
  </nav>
  <main id="page-container" tabindex="0" aria-label="Scrollable PDF document">
    <p id="viewer-message" role="status">Loading document…</p>
    <div id="pdf-pages" aria-label="Document pages"></div>
  </main>
</body>
</html>
